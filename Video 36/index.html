<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Introdunction</title>
    <!-- JavaScript (JS) is a programming language used to make websites interactive and dynamic.
    Example: button click, form validation, dropdown, slider, popup.
    Types of JavaScript (Frontend)
    Frontend JavaScript can be written in 3 ways:
    
    1. Inline JavaScript
    
    JS directly inside HTML element.
    <button onclick="alert('Hello')">Click</button>
    2. Internal JavaScript
    
    JS inside the HTML file using <script>.
        <script>
            alert("Hello");
        </script>
        
        3. External JavaScript
        
        JS in a separate .js file.
        HTML:
        <script src="script.js"></script>
        script.js:
        alert("Hello");
        Short notes
        Type	Where JS is written
        Inline JS	Inside HTML element
        Internal JS	Inside <script> tag in HTML
            External JS	Separate .js file
            Best practice: External JavaScript is preferred for bigger projects because HTML and JS remain separate.
            Frontend vs Backend JavaScript
            - Frontend JS: Runs in the browser. Used with HTML and CSS.
            - Backend JS: Runs on the server using Node.js.
            So JavaScript can be used for both frontend and backend development. -->
        </head>
        <body>
            <div class="box">
                Hey I am a box
            </div>

</body>
