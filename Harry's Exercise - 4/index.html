<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
       
@import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');

        *{
            margin: 0;
            padding: 0;
        }
        :root{
            --color:purple;
           --text-color:white;
            /* --seccolor:green; */
            --body-color:rgb(236, 138, 236);
            /* top bottom s 12px left right se 5 px */
            --defpad:12px 5px;
            
            --defmar:12px 5px;
        }
        body{
            background-color: var(--body-color);
        }
     
        nav{

            
            background-color: var(--color);
        }
        ul{

            display: flex;
        }
        ul li{
            list-style: none;
    padding: var(--defpad);
    margin: var(--defmar);
    /* background-color: var(--seccolor); */
  font-family: "Baloo Bhaijaan 2", sans-serif;

   font-weight: bold;
   font-size: 12px;
   
   color:var(--text-color);

        }
        /* li:first-child{ */
            /* --color:aqua;
            /* background-color: var(--color); */
            /* } */
        /* li:nth-child(3){ */
           /* --color:rgb(81, 255, 0); */
           /* background-color: var(--color); */
        /* } */
        /* li:nth-child(4){ */
           /* --color:rgb(255, 94, 0); */
           /* background-color: var(--color); */
        /* } */ 
        ul li a{
            /* see by commeting this first line color it will seen like link blue */
              color:var(--text-color);
              /* lin under names will remove */
              text-decoration: none;
        }

    
        
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="/">Tanya</a></li>
            <li><a href="/">Shubman</a></li>
            <li><a href="/">Rohit</a></li>
            <li><a href="/">Raza</a></li>
        </ul>
    </nav>
</body>
</html>
