p {

Example:
.container {

}

Easy way to remember:
text-align → centers text

/* Normally, the order is:
1 → 2 → 3 → 4
After applying order: 1 to item 3, the order becomes:
1 → 2 → 4 → 3
Why? Flex items have order: 0 by default. Item 3 has order: 1, so it appears after the items with order: 0. */
/* isse jo flex item h unka order jese 1,2,3,4 h */
/* but if m kisi item ka order km krdu to vo pehle aayegga ex in html see   <div class="item">3</div> ye pehle ese h isme m order lga du ex  <div class="item order-1">3</div> yha mene ke or class add kr di order-1 so ab mera 3 sbse end m ajega jiski order aa jayegga 1,2,4 se */
/* order property changes the display order of flex items.
   Default order is 0.
   Items with smaller order values appear first.
   Example: order: 1 moves an item after items with order: 0.
   If two items have the same order, their HTML order is maintained.
*/
.order-1 {
    order: 1;
}
.order-1{

}
.order-2{

}
.order-3{
