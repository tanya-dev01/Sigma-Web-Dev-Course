    <!-- preload tells the browser how much of the audio should be loaded before the user plays it.

Example:

<audio src="song.mp3" controls preload="auto"></audio>

Main values:

auto → browser can load the audio in advance.
metadata → loads only basic information like duration.
none → doesn't preload the audio -->
