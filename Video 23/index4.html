        /* position in css in every small with ex
CSS has 5 main position values. Here is each one in simple words with a small example.

1. position: static;
Default position of every element.

top, left, right, and bottom have no effect.

.box {
  position: static;
  top: 20px; /* No effect 
}

2. position: relative;
Element stays in its normal position flow.

You can move it relative to its original position.

.box {
  position: relative;
  top: 20px;
  left: 10px;
}

The box moves 20px down and 10px right.

3. position: absolute;
Element is removed from normal flow.

Positioned relative to its nearest positioned ancestor (one whose position is not static), or the initial containing block if none exists.

.parent {
  position: relative;
}

.box {
  position: absolute;
  top: 0;
  right: 0;
}

The box appears at the parent's top-right corner.

4. position: fixed;
- Element stays in the same place relative to the browser viewport, even while scrolling.

.box {
  position: fixed;
  bottom: 10px;
  right: 10px;
}

Example: a floating help button at the bottom-right of the screen.

5. position: sticky;
- Element behaves normally until you scroll to a specified point, then sticks in place within its scrolling container.

h2 {
  position: sticky;
  top: 0;
}

Example: a heading that sticks to the top while you scroll.

Quick revision
Position

Easy meaning

static

Normal position

relative

Moves from its original position

absolute

Positioned relative to a containing block

fixed

Stays fixed on the viewport

sticky

Scrolls, then sticks

Memory trick: Static = normal, Relative = original position se move, Absolute = positioned independently, Fixed = stays on screen, Sticky = sticks while scrolling.
