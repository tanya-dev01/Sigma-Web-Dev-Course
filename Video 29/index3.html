Why?
You have:
.container {
    width: 80vw;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
}
   important: this is widthout width 55px from items so remove 55px then it will look like it.
So the container has 3 equal columns.

If your screen width were, for example, 1000px:
- 80vw = 800px
- 3 columns = 800 ÷ 3 ≈ 266.67px each
So:
Column 1       Column 2       Column 3
   ↓              ↓              ↓
┌────────┐     ┌────────┐     ┌────────┐
│   1    │     │   2    │     │   3    │
├────────┤     ├────────┤     ├────────┤
│   4    │     │   5    │     │        │
└────────┘     └────────┘     └────────┘

Also, because you gave each .items:
height: 55px;

             /* CSS Grid Properties (Easy Notes)

1. justify-content

Theory: Moves the whole grid horizontally inside the container when extra space is available.

Before:

┌──────────────────────────────┐
│ ┌────────────┐               │
│ │ 1   2   3  │               │
│ └────────────┘               │
└──────────────────────────────┘

After justify-content: center;

┌──────────────────────────────┐
│       ┌────────────┐         │
│       │ 1   2   3  │         │
│       └────────────┘         │
└──────────────────────────────┘

2. justify-items

Theory: Centers all items horizontally inside their own columns.

Before:

┌──────────┬──────────┬──────────┐
│ ┌───┐    │ ┌───┐    │ ┌───┐    │
│ │ 1 │    │ │ 2 │    │ │ 3 │    │
│ └───┘    │ └───┘    │ └───┘    │
└──────────┴──────────┴──────────┘

After justify-items: center;

┌──────────┬──────────┬──────────┐
│    ┌───┐ │    ┌───┐ │    ┌───┐ │
│    │ 1 │ │    │ 2 │ │    │ 3 │ │
│    └───┘ │    └───┘ │    └───┘ │
└──────────┴──────────┴──────────┘

3. align-items

Theory: Centers all items vertically inside their grid rows.

Before:

┌──────────┬──────────┐
│ ┌───┐    │ ┌───┐    │
│ │ 1 │    │ │ 2 │    │
│ └───┘    │ └───┘    │
│          │          │
└──────────┴──────────┘

After align-items: center;

┌──────────┬──────────┐
│          │          │
│   ┌───┐  │   ┌───┐  │
│   │ 1 │  │   │ 2 │  │
│   └───┘  │   └───┘  │
│          │          │
└──────────┴──────────┘

4. justify-self

Theory: Moves only one item horizontally inside its own column.

Before:

┌──────────┬──────────┐
│ ┌───┐    │ ┌───┐    │
│ │ 1 │    │ │ 2 │    │
│ └───┘    │ └───┘    │
└──────────┴──────────┘

After .item1 { justify-self: end; }

┌──────────┬──────────┐
│    ┌───┐ │ ┌───┐    │
│    │ 1 │ │ │ 2 │    │
│    └───┘ │ └───┘    │
└──────────┴──────────┘

Quick revision

justify-content → whole grid horizontally.

justify-items → all items horizontally inside columns.

align-items → all items vertically inside rows.

justify-self → one item horizontally inside its column.

Important: These examples assume there is enough extra space for the items to move. */
