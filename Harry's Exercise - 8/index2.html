<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- bounce the ball -->
    <style>
        .container{
            width: 80vw;
            height: 80vh;
            background-color: rgb(13, 0, 255);
            position: relative;
        }
        .ball{
            background-color: red;
            border-radius: 70px;
          width: 110px;
          height: 111px;
       left: 0;
       bottom: 0;
            position: absolute;
          /* animation: animateX 3s linear infinite; */
          /* by alternate ye upar niche upar niche hota rhega */
          /* animation: animateY 1s ease-out infinite alternate; */
          /* now i will add both animations */
         animation: animateX 3s linear infinite,animateY 1s ease-out infinite alternate;
        }
        @keyframes animateX {
            from{
left: 0;
            }
            to{
left: 100%;
            }
        }
        @keyframes animateY {
            from{
bottom: 0%;
            }
            to{
bottom: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ball">

        </div>
    </div>
</body>
</html>
