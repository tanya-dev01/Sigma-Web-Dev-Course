    <!-- CSS object-fit
object-fit controls how an image/video fits inside its fixed width and height.

Example:
img {
    width: 300px;
    height: 200px;
    object-fit: cover;
}

object-fit: cover
It makes the image completely fill the box while keeping its original ratio.

👉 If the image doesn't have the same ratio as the box, some part of the image gets cut off.

Think:

Box = 300 × 200
Image = 500 × 500

cover → fills the entire 300×200 box, but cuts some top/bottom or sides.
object-fit: cover;

Easy memory:
cover = box completely covered, image may be cropped. -->
<!-- object-fit — short
It controls how an image/video fits inside its given box.

Example:
img {
    width: 300px;
    height: 200px;
    object-fit: cover;
}

object-fit: cover → image fills the whole 300 × 200 box, and some part of the image may be cropped.

Common values:
- cover → fills box, may crop
- contain → whole image visible, may leave empty space
- fill → stretches image to fit
- none → keeps original size
- scale-down → chooses smaller of none or contain -->
