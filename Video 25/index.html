    <title>Media Queries</title>
    <!-- Media queries are used to make a website responsive so that it looks good on mobile, tablet, and laptop screens. They apply different CSS styles depending on the screen size.
Example:
.box {
    background-color: blue;
}

/* For mobile screens */
@media only screen and (max-width: 600px) {
    .box {
        background-color: red;
    }
}




Explanation:
- @media — starts a media query.
- max-width: 600px — applies the CSS when the screen width is 600px or less.
min-width: 600px → applies when the screen width is 600px or more.
- Above 600px — the box is blue.
- At 600px or less — the box becomes red.
Remember: Media queries help make websites responsive on different screen sizes. -->
